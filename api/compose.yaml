# api.su-labs.dev on the server: the API and its PostgreSQL database.
#
# - `npm run deploy:api` (repo root) uploads this folder to /home/ubuntu/su-labs-api and runs `docker compose up`.
# - Secrets live in /home/ubuntu/su-labs-api/.env on the server only (see .env.example); never in the repo.
# - The API listens on 127.0.0.1:3002; the Cloudflare Tunnel forwards api.su-labs.dev there, and nothing else can
#   reach it, which is why it may trust Cloudflare's visitor address header.
# - Data lives in two volumes: db-data (the database) and uploads (suggestion pictures). Back both up.
name: su-labs-api

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: su_labs
      POSTGRES_USER: su_labs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U su_labs -d su_labs']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://su_labs:${POSTGRES_PASSWORD}@db:5432/su_labs
      UPLOADS_DIR: /data/uploads
      TRUST_CLOUDFLARE: 'true'
    ports:
      - '127.0.0.1:3002:3000'
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
