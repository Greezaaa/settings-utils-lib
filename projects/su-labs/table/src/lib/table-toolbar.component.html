@let t = labels();
<div class="su-table-bar">
  @if (searchable()) {
    <div class="su-table-search">
      <svg class="su-table-search-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <input
        type="search"
        class="su-table-search-input"
        [id]="controlId() + '-search'"
        [value]="query()"
        [attr.aria-label]="t.search"
        [attr.placeholder]="t.search"
        (input)="onQuery($event)"
        (keydown.escape)="clearQuery($event)"
      />
    </div>
  }
  @if (columnControls()) {
    <button
      type="button"
      class="su-table-button"
      [attr.aria-expanded]="columnsOpen()"
      [attr.aria-controls]="controlId() + '-columns'"
      (click)="columnsOpen.set(!columnsOpen())"
    >
      {{ t.columns }}
    </button>
  }
</div>
@if (columnControls() && columnsOpen()) {
  <div class="su-table-panel" role="group" [id]="controlId() + '-columns'" [attr.aria-label]="t.columns">
    @for (column of columns(); track column.key) {
      <div class="su-table-field">
        <label class="su-table-check">
          <input
            type="checkbox"
            [checked]="column.visible"
            [disabled]="column.visible && lastShown()"
            (change)="onVisible(column.key, $event)"
          />
          {{ column.header }}
        </label>
        <select
          class="su-table-select"
          [attr.aria-label]="t.pinColumn(column.header)"
          [disabled]="!column.visible"
          (change)="onPin(column.key, $event)"
        >
          <option value="" [selected]="column.pinned === null">{{ t.pinNone }}</option>
          <option value="start" [selected]="column.pinned === 'start'">{{ t.pinStart }}</option>
          <option value="end" [selected]="column.pinned === 'end'">{{ t.pinEnd }}</option>
        </select>
      </div>
    }
  </div>
}
