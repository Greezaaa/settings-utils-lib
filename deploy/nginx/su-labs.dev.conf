# nginx site for https://su-labs.dev/
# Serves the static build of `web/`, uploaded by `npm run deploy:web` (dist/web/browser → /home/ubuntu/su-labs-site).
# Install: copy to /etc/nginx/sites-available/su-labs.dev, link it into sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
# Certificates: Let's Encrypt (`sudo certbot --nginx -d su-labs.dev`); adjust the paths if yours differ.

# Plain HTTP only redirects to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name su-labs.dev;

  return 301 https://su-labs.dev$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name su-labs.dev;

  ssl_certificate /etc/letsencrypt/live/su-labs.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/su-labs.dev/privkey.pem;

  root /home/ubuntu/su-labs-site;
  index index.html;

  # Every page is prerendered to <path>/index.html; anything else gets the site's own not-found page
  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # The build puts a content hash in every script and stylesheet name, so they can be cached for good
  location ~* \.(?:js|css)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
