# nginx config for https://su-labs.dev/, used by the `su-labs-site` Docker container (nginx:alpine) on the server.
#
# - `npm run deploy:web` uploads dist/web/browser to /home/ubuntu/su-labs-site, which the container mounts
#   read-only as /usr/share/nginx/html.
# - This file is mounted as the container's /etc/nginx/conf.d/default.conf.
# - The Cloudflare Tunnel "Oracle-Cloud" forwards su-labs.dev to http://localhost:3000 (→ port 80 here);
#   Cloudflare handles HTTPS, so there is no TLS in this file.

# Caching by address: hashed scripts and styles for good; everything else as nginx decides
map $request_uri $su_site_cache_control {
  ~*\.(?:js|css)(?:\?|$) "public, max-age=31536000, immutable";
  default "";
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name su-labs.dev;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers on every response. They're set only here: nginx drops server-level add_header lines in any
  # location that has its own, which is why caching goes through $su_site_cache_control above instead.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Pages may only be framed by this site itself (no clickjacking, e.g. of the admin page); plugins and <base> tags
  # are off. Scripts and styles aren't restricted here, as the pages have an inline theme script.
  add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  # The site uses no devices
  add_header Permissions-Policy "microphone=(), camera=(), geolocation=(), payment=()" always;
  # Not `always`: caching is for successful answers only, never for a 404
  add_header Cache-Control $su_site_cache_control;

  # Every page is prerendered to <path>/index.html; anything else gets the site's own not-found page
  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # The build puts a content hash in every script and stylesheet name, so they can be cached for good
  location ~* \.(?:js|css)$ {
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
