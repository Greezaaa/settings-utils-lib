# nginx config for https://games.su-labs.dev/, used by the `su-labs-games` Docker container (nginx:alpine) on the server.
#
# - `npm run deploy:games` uploads dist/games/browser to /home/ubuntu/su-labs-games, which the container mounts
#   read-only as /usr/share/nginx/html.
# - This file is mounted as the container's /etc/nginx/conf.d/default.conf.
# - The Cloudflare Tunnel "Oracle-Cloud" forwards games.su-labs.dev to http://localhost:3001 (→ port 80 here);
#   Cloudflare handles HTTPS, so there is no TLS in this file.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name games.su-labs.dev;

  root /usr/share/nginx/html;
  index index.html;

  # Every page is prerendered to <path>/index.html; anything else gets the site's own not-found page
  error_page 404 /404.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # The build puts a content hash in every script and stylesheet name, so they can be cached for good
  location ~* \.(?:js|css)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Invite links for new admins are built in the browser (the Angular app's client-rendered shell); never cached.
  # Matches ADMIN_INVITE_PATH in games/src/app/core/links.ts.
  location /crew/invite/ {
    try_files /index.csr.html =404;
    add_header Cache-Control "no-store";
  }

  # The word builder's dictionaries: the app asks for them with a version (?v=) that changes when they are rebuilt
  location /dictionaries/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
}
