<header class="container page-head">
  <div class="page-meta">
    <span class="tag">Free tool</span>
    <span class="tag">CSS</span>
  </div>
  <h1>CSS tricks</h1>
  <p class="lead">
    Eight one-line CSS tricks, each working live.
    <br />
    Hover the shape, swipe the slides, scroll the last box, then copy the code.
  </p>
</header>

<section class="container page-section" aria-labelledby="tricks-title">
  <h2 id="tricks-title" class="section-title">Try them</h2>
  @defer (on viewport) {
    <app-demo-block name="css-tricks" heading="All eight" hint="Gradient text, frosted glass, :has(), blend modes, clip-path, balanced headings, scroll snap and a scroll timeline.">
      <app-css-tricks />
    </app-demo-block>
  } @placeholder {
    <div class="demo-placeholder"></div>
  }
</section>
