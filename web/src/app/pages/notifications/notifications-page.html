<app-utility-page [utility]="utility" [usage]="usage" featuresTitle="Make it your own" featuresLead="Give the toasts your site’s colours, sizes and timing.">
  <div class="card demo-grid">
    <div class="demo-controls">
      <div class="field">
        <span id="types-label">Show a notification</span>
        <div class="button-row" role="group" aria-labelledby="types-label">
          @for (example of examples; track example.type) {
            <button type="button" class="button button-secondary button-small" (click)="show(example.type, example.message)">
              {{ example.label }}
            </button>
          }
        </div>
      </div>

      <label class="field">
        <span>Position</span>
        <su-lib-select [options]="positions" [value]="position()" (chosen)="setPosition($event)" />
      </label>

      <label class="field">
        <span>Duration</span>
        <su-lib-select [options]="durations" [value]="duration()" [disabled]="!autoClose()" (chosen)="duration.set($event)" />
      </label>

      <label class="checkbox">
        <input type="checkbox" [checked]="autoClose()" (change)="setAutoClose($event)" />
        Close automatically
      </label>

      <div>
        <button type="button" class="button button-small" (click)="notifications.clearAll()">Clear all</button>
      </div>
    </div>

    <dl class="state-list">
      <div>
        <dt>Visible</dt>
        <dd>{{ notifications.notifications().length }}</dd>
      </div>
      <div>
        <dt>Position</dt>
        <dd>{{ position() }}</dd>
      </div>
      <div>
        <dt>Auto close</dt>
        <dd>{{ autoClose() ? duration() + ' ms' : 'off' }}</dd>
      </div>
    </dl>
  </div>
  <p class="muted">The position applies to the whole site, including the copy confirmations.</p>

  <ng-template [appPageFeature]="features.theming">
    <div class="card">
      <button type="button" class="button" (click)="showThemed()">Show a toast in its own look</button>
    </div>
  </ng-template>
</app-utility-page>
