<div class="tricks">
  <figure class="trick">
    <p class="gradient-text">Gradient text</p>
    <figcaption><code>background-clip: text</code></figcaption>
  </figure>

  <figure class="trick trick-glass">
    <div class="glass">Frosted glass</div>
    <figcaption><code>backdrop-filter: blur()</code></figcaption>
  </figure>

  <figure class="trick">
    <label class="has-card">
      <input type="checkbox" />
      Tick me, the whole card reacts
    </label>
    <figcaption><code>:has(input:checked)</code></figcaption>
  </figure>

  <figure class="trick">
    <div class="blend">
      <span class="blend-text">Always readable</span>
    </div>
    <figcaption><code>mix-blend-mode: difference</code></figcaption>
  </figure>

  <figure class="trick">
    <div class="clip"></div>
    <figcaption><code>clip-path</code> (hover it)</figcaption>
  </figure>

  <figure class="trick">
    <p class="balanced">A heading that wraps into lines of nearly equal length</p>
    <figcaption><code>text-wrap: balance</code></figcaption>
  </figure>

  <figure class="trick">
    <div class="snap">
      @for (slide of slides; track slide) {
        <div class="snap-slide">{{ slide }}</div>
      }
    </div>
    <figcaption><code>scroll-snap-type</code> (swipe it)</figcaption>
  </figure>

  <figure class="trick">
    <div class="scroll-box">
      <div class="scroll-bar"></div>
      <p>Scroll inside this box.</p>
      <p>The bar on top follows your scroll with no JavaScript.</p>
      <p>It uses a scroll timeline on this box.</p>
      <p>Keep going.</p>
      <p>Almost there.</p>
      <p>Done.</p>
    </div>
    <figcaption><code>animation-timeline: scroll()</code></figcaption>
  </figure>
</div>
