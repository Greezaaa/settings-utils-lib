<div class="stage" [class]="'effect-' + effect()" [attr.aria-busy]="playing()">
  @for (lane of easedLanes(); track lane.label) {
    <div class="lane">
      <span class="lane-label mono">{{ lane.label }}</span>
      <div class="track" [style.--progress]="lane.value">
        <span class="box" aria-hidden="true"></span>
      </div>
    </div>
  }
</div>
