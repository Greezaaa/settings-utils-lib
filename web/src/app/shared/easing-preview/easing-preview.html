<div class="button-row" role="group" aria-label="What the preview animates">
  @for (item of effects; track item.value) {
    <button
      type="button"
      class="button button-secondary button-small"
      [attr.aria-pressed]="effect() === item.value"
      (click)="chooseEffect(item.value)">
      {{ item.label }}
    </button>
  }
</div>
<div class="stage" [class]="'effect-' + effect()">
  @for (lane of easedLanes(); track lane.label) {
    <div class="lane">
      <span class="lane-label mono">{{ lane.label }}</span>
      <div class="track" [style.--progress]="lane.value">
        <span class="box" aria-hidden="true"></span>
      </div>
    </div>
  }
</div>
<div class="button-row">
  <button type="button" class="button" (click)="play()">Play</button>
</div>
