<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>su-labs: framework-agnostic browser utilities</title>
  <meta name="description" content="Framework-agnostic browser utilities for theme, font size, notifications, scroll spy and visit tracking. Works with React, Vue, Svelte, Angular, vanilla JavaScript and Node.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
  <meta name="author" content="Yevheniy Alekseyev">
  <!-- Structured data for search engines. URLs must match SITE_URL in app/core/links.ts -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "su-labs",
          "url": "https://su-labs.dev/",
          "description": "Framework-agnostic browser utilities for theme, font size, notifications, scroll spy and visit tracking. Works with React, Vue, Svelte, Angular, vanilla JavaScript and Node."
        },
        {
          "@type": "SoftwareSourceCode",
          "name": "su-labs",
          "description": "Framework-agnostic browser utilities with Angular wrappers: theme, font size, notifications, scroll spy and visit tracking.",
          "codeRepository": "https://github.com/Greezaaa/settings-utils-lib",
          "programmingLanguage": "TypeScript",
          "runtimePlatform": ["Browser", "Node.js"],
          "license": "https://opensource.org/licenses/MIT",
          "author": { "@type": "Person", "name": "Yevheniy Alekseyev", "url": "https://github.com/Greezaaa" }
        }
      ]
    }
  </script>
  <!--
    Apply the saved theme and text size before the first paint, so the page doesn't flash
    from the default to the visitor's choice while the app loads. The app then takes over.
    Both values live in cookies shared with the other su-labs site; keys must match core/shared-settings.ts.
  -->
  <script>
    (function () {
      var root = document.documentElement;
      function readSetting(key) {
        var name = encodeURIComponent(key) + '=';
        var cookies = document.cookie.split('; ');
        for (var i = 0; i < cookies.length; i++) {
          if (cookies[i].indexOf(name) === 0) {
            return decodeURIComponent(cookies[i].slice(name.length));
          }
        }
        return null;
      }
      try {
        var theme = readSetting('su-labs:theme');
        // A palette's colours only arrive with the app, so until then it shows like the system theme
        if (theme !== 'light' && theme !== 'dark' && theme !== 'contrast') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.setAttribute('data-theme', theme);

        var fontSize = Number(readSetting('su-labs:font-size'));
        if (fontSize >= 12 && fontSize <= 22) {
          root.style.setProperty('--base-font-size', fontSize + 'px');
        }
      } catch (error) {
        // Cookies blocked: the app applies the defaults once it starts
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300..600&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
