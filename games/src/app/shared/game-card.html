<a class="card game-card" [routerLink]="['/', game()]">
  <span class="tags">
    <span class="tag">{{ t().page.ages(minAge()) }}</span>
    @if (isNew()) {
      <span class="tag tag-green">{{ t().page.new }}</span>
    }
  </span>
  <h3 class="game-name">{{ t().games[game()].name }}</h3>
  <p class="muted">{{ t().games[game()].summary }}</p>
</a>
