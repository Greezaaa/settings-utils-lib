<!-- The whole card is the link (its ::after covers the card); the heart sits on top of it, as a button can't go inside a link -->
<article class="card game-card">
  <span class="tags">
    <span class="tag">{{ t().page.ages(minAge()) }}</span>
    @if (isNew()) {
      <span class="tag tag-green">{{ t().page.new }}</span>
    }
    @if (isHidden()) {
      <span class="tag tag-red">{{ t().page.hidden }}</span>
    }
    @if (isPopular()) {
      <span class="tag tag-yellow">{{ t().page.popular }}</span>
    }
  </span>
  <h3 class="game-name">
    <a class="game-link" [routerLink]="['/', game()]">{{ t().games[game()].name }}</a>
  </h3>
  <p class="muted">{{ t().games[game()].summary }}</p>
  @if (canFavorite()) {
    <button
      type="button"
      class="favorite"
      [attr.aria-pressed]="isFavorite()"
      [attr.aria-label]="
        isFavorite() ? t().page.removeFavorite(t().games[game()].name) : t().page.addFavorite(t().games[game()].name)
      "
      (click)="favorites.toggle(game())"
    >
      {{ isFavorite() ? '♥' : '♡' }}
    </button>
  }
</article>
