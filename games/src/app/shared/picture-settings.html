<div class="choices" role="group" [attr.aria-label]="t().pictureGames.modeGroup">
  @for (option of modes; track option) {
    <button
      type="button"
      class="button button-secondary"
      [attr.aria-pressed]="option === mode()"
      [title]="t().pictureGames.modes[option].summary"
      (click)="modeChange.emit(option)"
    >
      {{ t().pictureGames.modes[option].name }}
    </button>
  }
</div>

<div class="levels" role="group" [attr.aria-label]="t().pictureGames.levelGroup">
  @for (option of levels; track option.id) {
    <button
      type="button"
      class="button button-secondary level"
      [attr.aria-pressed]="option.id === level()"
      (click)="levelChange.emit(option.id)"
    >
      <span class="level-name">{{ t().pictureGames.levels[option.id].name }}</span>
      <span class="level-summary">{{ t().pictureGames.levels[option.id].summary }}</span>
    </button>
  }
</div>
