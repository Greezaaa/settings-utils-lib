<p
  class="answer-line"
  [class.visually-hidden]="!words.isOn()"
  [class.is-right]="result() === true"
  [class.is-wrong]="result() === false"
  aria-live="polite"
>
  @let isRight = result();
  @if (isRight !== null) {
    {{ isRight ? t().answers.right : answer() ? t().answers.wrongWith(answer()) : t().answers.wrong }}
  }
</p>
