<header class="container page-head">
  <h1>{{ t().account.resetTitle }}</h1>
  <p class="lead">{{ t().account.resetLead }}</p>
</header>

<section class="container page-section">
  <form class="card account-card" (submit)="$event.preventDefault(); save(resetForm)" #resetForm>
    <label class="field">
      <span>{{ t().account.newPassword }}</span>
      <input name="password" type="password" autocomplete="new-password" [attr.minlength]="minLength" required />
      <small class="muted">{{ t().account.passwordRule(minLength) }}</small>
    </label>
    <label class="field">
      <span>{{ t().account.repeatPassword }}</span>
      <input name="repeat" type="password" autocomplete="new-password" [attr.minlength]="minLength" required />
    </label>
    @if (form.error(); as error) {
      <p class="error" role="alert">{{ error }}</p>
    }
    <button type="submit" class="button" [disabled]="form.isBusy()">{{ t().account.resetSave }}</button>
  </form>
</section>
