<div class="field">
  <span class="label-row">
    <label for="screen-name">{{ t().account.screenName }}</label>
    <!-- Shown on hover and on focus, so a tap on a phone opens it too -->
    <span class="tip">
      <button
        type="button"
        class="tip-button"
        [attr.aria-label]="t().account.screenNameTipLabel"
        aria-describedby="screen-name-tip"
      >
        ?
      </button>
      <span class="tip-text" id="screen-name-tip" role="tooltip">{{ t().account.screenNameTip }}</span>
    </span>
  </span>
  <input
    id="screen-name"
    name="screenName"
    type="text"
    autocomplete="nickname"
    minlength="3"
    maxlength="20"
    required
    [value]="value()"
  />
  <small class="muted">{{ t().account.screenNameHint }}</small>
</div>
