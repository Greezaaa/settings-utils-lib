<div class="card admin-card">
  <label class="switch-row">
    <span>
      <strong>{{ t().admin.previewTitle }}</strong>
      <small class="muted">{{ t().admin.previewHelp(t().page.hidden) }}</small>
    </span>
    <input type="checkbox" role="switch" [checked]="availability.isPreview()" (change)="togglePreview()" />
  </label>
</div>

<h2 class="section-title">{{ t().admin.gamesTitle }}</h2>
<ul class="card admin-card plain-list">
  @for (game of games; track game.slug) {
    <li>
      <label class="switch-row">
        <span>
          <a [routerLink]="['/', game.slug]">{{ t().games[game.slug].name }}</a>
          <small class="muted">
            {{ availability.isOpen(game.slug) ? t().admin.open : t().admin.hidden }}
            · {{ t().admin.byDefault(game.openByDefault) }}
          </small>
        </span>
        <input
          type="checkbox"
          role="switch"
          [checked]="availability.isOpen(game.slug)"
          [disabled]="saving() !== null"
          (change)="toggle(game.slug)"
        />
      </label>
    </li>
  }
</ul>
@if (saveFailed()) {
  <p class="error" role="alert">{{ t().admin.saveFailed }}</p>
}
