<div class="card admin-card">
  <label class="switch-row">
    <span>
      <strong>Preview mode</strong>
      <small class="muted">This browser shows every game, open or not, marked “{{ t().page.hidden }}” when hidden.</small>
    </span>
    <input type="checkbox" role="switch" [checked]="availability.isPreview()" (change)="togglePreview()" />
  </label>
</div>

<h2 class="section-title">Games</h2>
<ul class="card admin-card plain-list">
  @for (game of games; track game.slug) {
    <li>
      <label class="switch-row">
        <span>
          <a [routerLink]="['/', game.slug]">{{ t().games[game.slug].name }}</a>
          <small class="muted">
            {{ availability.isOpen(game.slug) ? 'Open to everyone' : 'Hidden from the public' }}
            · default: {{ game.openByDefault ? 'open' : 'hidden' }}
          </small>
        </span>
        <input
          type="checkbox"
          role="switch"
          [checked]="availability.isOpen(game.slug)"
          [disabled]="saving() !== null"
          (change)="toggle(game.slug)"
        />
      </label>
    </li>
  }
</ul>
@if (saveFailed()) {
  <p class="error" role="alert">That change didn't save. Check the API and try again.</p>
}
