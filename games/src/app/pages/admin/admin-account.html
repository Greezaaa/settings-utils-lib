<form class="card admin-card" (submit)="change($event, form, current, next, repeat)" #form>
  <h2 class="card-title">{{ t().admin.changePassword }}</h2>
  <p class="muted">{{ admin.me()?.email }}</p>
  <label class="field">
    <span>{{ t().admin.currentPassword }}</span>
    <input #current type="password" autocomplete="current-password" required />
  </label>
  <label class="field">
    <span>{{ t().admin.newPassword }}</span>
    <input #next type="password" autocomplete="new-password" [attr.minlength]="minLength" required />
    <small class="muted">{{ t().admin.passwordRule(minLength) }}</small>
  </label>
  <label class="field">
    <span>{{ t().admin.repeatPassword }}</span>
    <input #repeat type="password" autocomplete="new-password" [attr.minlength]="minLength" required />
  </label>
  @switch (saving()) {
    @case ('saved') {
      <p class="success" role="status">{{ t().admin.passwordChanged }}</p>
    }
    @case ('wrong') {
      <p class="error" role="alert">{{ t().admin.wrongPassword }}</p>
    }
    @case ('mismatch') {
      <p class="error" role="alert">{{ t().admin.passwordsDiffer }}</p>
    }
    @case ('offline') {
      <p class="error" role="alert">{{ t().admin.offline }}</p>
    }
  }
  <button type="submit" class="button" [disabled]="saving() === 'saving'">{{ t().admin.changePassword }}</button>
</form>
