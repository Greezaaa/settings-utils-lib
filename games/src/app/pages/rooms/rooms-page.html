<header class="container page-head">
  <h1>{{ 'rooms.title' | translate }}</h1>
  <p class="lead">
    {{ 'rooms.lead' | translate }}
    <br />
    {{ 'rooms.rule' | translate }}
  </p>
</header>

<section class="container page-section rooms-entry">
  <div class="card entry-card">
    <button
      type="button"
      class="button start"
      [disabled]="client.connection() === 'connecting'"
      (click)="create()"
    >
      {{ client.connection() === 'connecting' ? ('rooms.connecting' | translate) : ('rooms.create' | translate) }}
    </button>
  </div>

  <form class="card entry-card" (submit)="join($event, codeInput)">
    <h2 class="card-title">{{ 'rooms.joinTitle' | translate }}</h2>
    <label class="field">
      <span>{{ 'rooms.codeLabel' | translate }}</span>
      <input
        #codeInput
        class="code-input"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        maxlength="6"
        placeholder="K7MPQ2"
        required
      />
    </label>
    <button type="submit" class="button">{{ 'rooms.join' | translate }}</button>
  </form>

  @if (client.error(); as error) {
    <p class="error" role="alert">{{ ('rooms.errors' | translate)[error] }}</p>
  }
</section>
