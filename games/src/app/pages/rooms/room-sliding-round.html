<div class="status">
  <span class="mono">{{ t().rooms.timeLeft(clock.secondsLeft()) }}</span>
  @if (showScore()) {
    <span class="mono">{{ t().rooms.yourScore(run.score()) }}</span>
  }
</div>
<app-timer-bar [share]="clock.share()" />

@if (!clock.isOver()) {
  <app-sliding-board
    [puzzle]="puzzle()"
    [pictureMode]="settings().pictureMode"
    [picture]="drawing()"
    (slid)="slide($event)"
  />
  <p class="progress" aria-live="polite">
    {{ isSolved() ? t().slidingPuzzle.solved : t().pictureGames.inPlace(inPlace(), tileCount()) }}
  </p>
}
