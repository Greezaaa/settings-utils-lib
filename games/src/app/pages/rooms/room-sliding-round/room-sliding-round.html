<div class="status">
  <span class="mono">{{ 'rooms.timeLeft' | translate: clock.secondsLeft() }}</span>
  @if (showScore()) {
    <span class="mono">{{ 'rooms.yourScore' | translate: run.score() }}</span>
  }
</div>
<app-timer-bar [share]="clock.share()" />

@if (!clock.isOver()) {
  <app-sliding-board
    [puzzle]="puzzle()"
    [pictureMode]="settings().pictureMode"
    [picture]="drawing()"
    (slid)="slide($event)"
  />
  <p class="progress" aria-live="polite">
    {{ isSolved() ? ('slidingPuzzle.solved' | translate) : ('pictureGames.inPlace' | translate: inPlace() : tileCount()) }}
  </p>
}
