<p class="picture" aria-hidden="true">{{ word().picture.emoji }}</p>
<p class="word" [class.is-wrong]="feedback.isWrong()" [class.is-done]="isDone()" aria-live="polite">
  @for (letter of letters(); track $index) {
    @if (isShown($index)) {
      <span class="letter">{{ letter }}</span>
    } @else {
      <span class="letter gap" [class.is-next]="$index === nextGap()" role="img" [attr.aria-label]="'letterGames.gap' | translate"></span>
    }
  }
</p>
<div class="tiles" role="group" [attr.aria-label]="'letterGames.letters' | translate">
  @for (vowel of vowels(); track vowel) {
    <button type="button" class="tile" [class.is-hint]="vowel === hintVowel()" [disabled]="isDone()" (click)="tap(vowel)">{{ vowel }}</button>
  }
</div>
<app-answer-line [result]="result()" />
<p class="keys-hint">{{ 'letterGames.keys' | translate }}</p>
