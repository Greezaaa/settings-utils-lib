<button type="button" class="button button-secondary listen" [disabled]="player.isPlaying()" (click)="listen()">🔊 {{ 'hitTheNote.listenTwo' | translate }}</button>
<div class="keys directions">
  @for (direction of directions; track direction) {
    <button
      type="button"
      class="key direction"
      [class.is-right]="given() && direction === round().answer"
      [class.is-wrong-answer]="given() === direction && direction !== round().answer"
      [disabled]="player.isPlaying() && !given()"
      (click)="answer(direction)"
    >
      {{ direction === 'higher' ? '⬆' : '⬇' }} {{ ('hitTheNote.directions' | translate)[direction] }}
    </button>
  }
</div>
<app-answer-line [result]="result()" [answer]="('hitTheNote.directions' | translate)[round().answer]" />
