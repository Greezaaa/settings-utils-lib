<button type="button" class="button button-secondary listen" [disabled]="player.isPlaying()" (click)="listen()">🔊 {{ 'hitTheNote.listen' | translate }}</button>
<div class="keys" [class.is-wrong]="feedback.isWrong()" role="group" [attr.aria-label]="'hitTheNote.notes' | translate">
  @for (id of choices(); track id) {
    <button
      type="button"
      class="key"
      [attr.data-note]="id"
      [class.is-sharp]="isSharp(id)"
      [class.is-right]="isDone() && id === note().id"
      [disabled]="player.isPlaying() && !isDone()"
      (click)="tap(id)"
    >
      {{ ('hitTheNote.noteNames' | translate)[id] }}
    </button>
  }
</div>
<app-answer-line [result]="result()" />
