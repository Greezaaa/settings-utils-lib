<svg viewBox="0 0 100 100" aria-hidden="true">
  @for (direction of lines(); track direction) {
    <line x1="50" y1="50" [attr.x2]="ends[direction].x" [attr.y2]="ends[direction].y" />
  }
  @if (lines().length) {
    <circle cx="50" cy="50" r="7" />
  }
</svg>
@if (number(); as number) {
  <span class="number">{{ number }}</span>
}
