<div
  class="board"
  [class.is-solved]="isSolved()"
  [style.--rows]="puzzle().shape.rows"
  [style.--columns]="puzzle().shape.columns"
  role="group"
  [attr.aria-label]="t().slidingPuzzle.board"
>
  @for (placed of tiles(); track placed.tile) {
    <button
      type="button"
      class="tile"
      [class.can-move]="placed.canMove"
      [style.transform]="position(placed.cell)"
      [attr.aria-label]="t().slidingPuzzle.tile(placed.number)"
      (pointerdown)="onPointerDown($event, placed.cell)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="cancelPress()"
      (click)="slide(placed.cell)"
    >
      @if (pictureMode() === 'drawing' && picture(); as drawing) {
        <app-picture-slice class="slice" [src]="drawing.src" [shape]="puzzle().shape" [cell]="placed.tile" />
        @if (!isSolved()) {
          <span class="drawing-number">{{ placed.number }}</span>
        }
      } @else {
        <app-puzzle-tile [lines]="puzzle().picture[placed.tile]" [number]="isSolved() ? null : placed.number" />
      }
    </button>
  }
  @if (isSolved() && pictureMode() === 'drawing' && picture(); as drawing) {
    <div class="tile" [style.transform]="position(puzzle().gap)" aria-hidden="true">
      <app-picture-slice class="slice" [src]="drawing.src" [shape]="puzzle().shape" [cell]="puzzle().gap" />
    </div>
  }
</div>
