<p class="equation" [class.is-right]="flash.result() === true" [class.is-wrong]="flash.result() === false">
  {{ prompt() }}
  <output class="typed" [class.is-empty]="!typed()" aria-live="polite" [attr.aria-label]="'yourAnswer.answer' | translate">{{ typed() || '?' }}</output>
</p>

<div class="pad" style="--columns: 3" role="group" [attr.aria-label]="'yourAnswer.numberPad' | translate">
  @for (digit of digits; track digit) {
    <button type="button" class="key" (click)="press(digit)">{{ digit }}</button>
  }
  <button type="button" class="key key-muted" [attr.aria-label]="'yourAnswer.delete' | translate" (click)="erase()">⌫</button>
  <button type="button" class="key" (click)="press('0')">0</button>
  <button type="button" class="key key-true" (click)="check()">{{ 'yourAnswer.check' | translate }}</button>
</div>

<app-answer-line [result]="flash.result()" [answer]="solution()" />
@if (showHint()) {
  <p class="hint" role="alert">{{ 'yourAnswer.tapNumberFirst' | translate }}</p>
}
