<ul class="changes">
  @for (item of items(); track item.key) {
    <li>
      <span class="when">
        @if (item.isNew) {
          <span class="tag tag-green">{{ t().page.new }}</span>
        }
        @if (item.day) {
          <time class="muted">{{ item.day }}</time>
        }
      </span>
      @if (item.game) {
        <a [routerLink]="['/', item.game]">{{ item.text }}</a>
      } @else {
        <span>{{ item.text }}</span>
      }
    </li>
  }
</ul>
@if (hasMore()) {
  <button type="button" class="button button-secondary button-small" (click)="isExpanded.set(!isExpanded())">
    {{ isExpanded() ? t().home.showFewer : t().home.showMore }}
  </button>
}
