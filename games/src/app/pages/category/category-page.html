<header class="container page-head">
  <div class="page-meta">
    <a class="tag" routerLink="/">{{ 'page.section' | translate }}</a>
    <span class="tag">{{ 'home.categoryGames' | translate: games().length }}</span>
  </div>
  <h1>{{ ('categories' | translate)[category()] }}</h1>
  <p class="lead">{{ ('categoryIntros' | translate)[category()] }}</p>
</header>

<section class="container page-section" [attr.aria-label]="('categories' | translate)[category()]">
  <div class="games">
    @for (game of games(); track game; let index = $index) {
      <app-game-card [game]="game" appReveal [style.--index]="index" />
    }
  </div>
</section>
